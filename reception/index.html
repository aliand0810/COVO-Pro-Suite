<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Réception">
<title>Réception Pro — COVO</title>
<script src="https://aliand0810.github.io/licences/licence_check.js" data-produit="COVO Pro" data-module="Gestion"></script>
<style>
:root{--bg:#f3f4f8;--card:#fff;--card2:#f1f2f7;--ink:#0f172a;--mute:#64748b;--line:#e2e5ee;--acc:#4338ca;--acc2:#2a78d6;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 6px 20px rgba(15,23,42,.08)}
html.dark,body.dark{--bg:#0b0f1a;--card:#141a29;--card2:#1b2234;--ink:#e8ecf6;--mute:#94a3b8;--line:#263049;--shadow:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}
header.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1e1b4b,#3730a3 60%,#2a78d6);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;box-shadow:0 4px 18px rgba(30,27,75,.35)}
header.top .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
header.top h1{margin:0;font-size:1.05rem;font-weight:900;line-height:1.15}
header.top small{display:block;font-size:.72rem;opacity:.8;font-weight:600}
header.top .sp{flex:1}
.hbtn{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:11px;padding:8px 11px;font-weight:800;font-size:.8rem;cursor:pointer;white-space:nowrap}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:.82rem;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:rgba(42,120,214,.1);border:1px solid rgba(42,120,214,.3)}
.banner.warn{background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.35)}
.banner a{color:var(--acc2);font-weight:800}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin:14px 0 10px}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-weight:800;font-size:.82rem;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg i{font-style:normal;background:var(--line);border-radius:10px;padding:0 6px;margin-left:4px;font-size:.72rem}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;margin-bottom:10px}
.bon{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:block;width:100%;text-align:left;color:inherit}
.bon .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.bon b{font-size:1rem}
.bon .m{font-size:.8rem;color:var(--mute);margin-top:3px}
.bar{height:7px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:800;white-space:nowrap}
.p-new{background:rgba(67,56,202,.12);color:#4338ca}.p-run{background:rgba(42,120,214,.13);color:#1d6fc7}.p-ok{background:rgba(22,163,74,.14);color:#15803d}.p-warn{background:rgba(217,119,6,.15);color:#b45309}.p-bad{background:rgba(220,38,38,.13);color:#b91c1c}.p-mute{background:var(--card2);color:var(--mute)}
body.dark .p-new{color:#a5b4fc}body.dark .p-run{color:#93c5fd}body.dark .p-ok{color:#86efac}body.dark .p-warn{color:#fcd34d}body.dark .p-bad{color:#fca5a5}
.empty{text-align:center;color:var(--mute);padding:34px 10px;font-size:.92rem}
.big{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-weight:900;font-size:1rem;cursor:pointer}
.b-pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 18px rgba(67,56,202,.35)}
.b-ok{background:var(--ok);color:#fff}.b-ghost{background:var(--card2);color:var(--ink)}
/* écran bon */
.sum{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.ring{width:78px;height:78px;position:relative}.ring svg{width:78px;height:78px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900}
.cnts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cnts div{background:var(--card2);border-radius:11px;padding:7px 8px;text-align:center}.cnts b{display:block;font-size:1.25rem;font-weight:900}.cnts small{font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--mute);letter-spacing:.03em}
.cam{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:52vh;display:none}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.cam .aim::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ef4444;box-shadow:0 0 10px #ef4444;animation:scanl 1.6s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-28px)}50%{transform:translateY(28px)}}
.cam .ctl{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.cam .ctl button{border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer}
.cam .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:700;font-size:.85rem;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.flash{margin-top:10px;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:12px;font-weight:800;animation:pop .25s ease}
.flash.on{display:flex}.flash .ic{font-size:1.8rem}.flash small{display:block;font-weight:600;font-size:.8rem;opacity:.85}
.flash.ok{background:rgba(22,163,74,.15);border:2px solid var(--ok)}.flash.warn{background:rgba(217,119,6,.13);border:2px solid var(--warn)}.flash.bad{background:rgba(220,38,38,.12);border:2px solid var(--bad)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.tools button{border:none;border-radius:12px;padding:0 14px;font-weight:900;cursor:pointer;background:var(--card2);color:var(--ink);font-size:.9rem}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px 0 8px;padding-bottom:2px}
.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 11px;font-size:.78rem;font-weight:800;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ln{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.ln.st-ok{border-left-color:var(--ok)}.ln.st-manque{border-left-color:var(--warn)}.ln.st-bad{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(220,38,38,.06),var(--card) 60%)}
.ln.hit{animation:hit .7s ease}@keyframes hit{0%{box-shadow:0 0 0 0 rgba(67,56,202,.6)}100%{box-shadow:0 0 0 14px rgba(67,56,202,0)}}
.ln .nm{font-weight:800;line-height:1.25}.ln .bc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;color:var(--mute);margin-top:2px}
.ln .q{text-align:right}.ln .q b{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums}.ln .q span{color:var(--mute);font-weight:700}
.ln .bt{grid-column:1/-1;display:flex;align-items:center;gap:8px;justify-content:space-between}
.step{display:flex;gap:6px}.step button{width:38px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-weight:900;font-size:1.05rem;cursor:pointer}
.step input{width:76px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;text-align:center}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.foot button{flex:1}
.money{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:14px}
.money h3{margin:0 0 8px;font-size:.95rem}
.money .r{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:4px 0}
.money input{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-size:1.15rem;font-weight:800;margin:6px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:1.15rem}.sheet .sub{color:var(--mute);font-size:.85rem;margin-bottom:12px}
.sheet ul{margin:6px 0 12px;padding-left:18px;font-size:.88rem;line-height:1.5}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card2);border-radius:12px;margin-bottom:8px;font-size:.88rem}
.chk input{width:22px;height:22px;flex-shrink:0;accent-color:var(--acc)}
.log{font-size:.78rem;color:var(--mute);margin-top:14px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.gate{max-width:480px;margin:60px auto;text-align:center;padding:24px}
.gate .ic{font-size:3rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:.88rem;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;max-width:90vw;text-align:center}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.spot{border:none;border-radius:18px;padding:16px 14px;text-align:left;color:#fff;background:linear-gradient(135deg,#4338ca,#2a78d6);box-shadow:0 8px 22px rgba(67,56,202,.3);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:118px}
.spot.s2{background:linear-gradient(135deg,#047857,#10b981);box-shadow:0 8px 22px rgba(4,120,87,.3)}
.spot .si{font-size:1.7rem}.spot b{font-size:1rem}.spot small{opacity:.88;font-size:.76rem;line-height:1.3}
@media(max-width:380px){.spots{grid-template-columns:1fr}}
.seg button i{font-style:normal}
.ln .tick{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:1.3rem;font-weight:900;cursor:pointer;justify-self:end}
.ln .tick.on{background:var(--ok);border-color:var(--ok)}
.grid2{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.02em}
.mini .step input{width:64px}
.price input{width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:900;font-size:1rem;text-align:right}
.lnk{border:none;background:none;color:var(--acc2);font-weight:800;font-size:.8rem;cursor:pointer;padding:4px 0}
.mute{color:var(--mute);font-size:.8rem}
.lbl{display:block;font-size:.74rem;font-weight:800;color:var(--mute);text-transform:uppercase;margin-top:6px}
.money select,.just select,.just input{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;margin-top:6px}
.money input{font-size:1rem}
.ln.st-just{border-left-color:#d97706}
.just{grid-column:1/-1;background:rgba(217,119,6,.08);border:1.5px dashed rgba(217,119,6,.55);border-radius:12px;padding:10px;margin-top:4px}
.just b{font-size:.86rem}
.jb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.jb button{flex:1;min-width:130px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 8px;font-weight:800;cursor:pointer;font-size:.82rem}
.jb .b-okk{background:var(--ok);border-color:var(--ok);color:#fff}
.big:disabled,.big.dim{opacity:.55}
.qrbox{background:#fff;border-radius:16px;padding:14px;text-align:center;margin:6px auto 14px;max-width:320px;color:#0f172a;font-family:monospace;font-weight:800}
.qrbox img{width:100%;height:auto;image-rendering:pixelated;display:block}
.sheet .cam{margin-bottom:10px}
body.embed header.top{padding-top:10px}
.hbtn{text-decoration:none;display:inline-block;margin-left:6px}
.banner.ok{background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.35)}
#qrcar-n{margin-top:6px;font-size:.95rem}
</style>
</head>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

        toast('✅ ' + b.numero + ' intégré' + (o.stock ? ' · stock' : '') + (priceChanges.length ? ' · ' + priceChanges.length + ' prix' : '') + (approId ? ' · achat enregistré' : ''), 3500);
        try { if (EMBED) parent.postMessage({ covoRecep: 'integrated', id: b.id }, '*'); } catch (e) {}
        renderReport(b);
    }

    /* ════════════ RAPPORT ════════════ */
    function renderReport(b) {
        VIEW = 'report'; CUR = b.id; camStop(); $('foot').style.display = '';
        var R = b.result || {}, P = b.purchase || {};
        setHead('✅ ' + b.numero, 'Intégré le ' + fdate(R.validatedAt, true), '<button class="hbtn" id="b-back">← Bons</button>'); $('b-back').onclick = renderList;
        var h = '<div class="sum" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:1.05rem">Rapport</b>' + statusPill(b) + '</div>' +
            '<div style="font-size:.85rem;color:var(--mute)">Achats : ' + (P.validatedAt ? fdate(P.validatedAt, true) + ' par ' + esc(P.by || '—') : '—') + '<br>' + (R.remote ? 'Vérifié sur ce téléphone, injecté dans COVO Pro par QR code' : 'Intégration par ' + esc(R.by || '—')) + (R.stockUpdated ? ' · stock (' + R.stockLines + ' article' + (R.stockLines > 1 ? 's' : '') + ')' : '') + ((R.priceChanges || []).length ? ' · ' + R.priceChanges.length + ' prix de vente' : '') + (R.approId ? ' · achat enregistré dans Approvisionnement Pro' : '') + '</div></div>';
        h += '<div class="money"><h3>💶 Achat</h3><div class="r"><span>Montant estimé du bon</span><b>' + eur(R.amountExpected) + '</b></div><div class="r"><span>Montant payé</span><b>' + (R.amountPaid == null ? '—' : eur(R.amountPaid) + ' · ' + (PAY[R.payMode] || '')) + '</b></div>' + (R.fournisseur ? '<div class="r"><span>Fournisseur</span><b>' + esc(R.fournisseur) + '</b></div>' : '') + '</div>';
        var just = (R.received || []).filter(function (x) { return x.justif; });
        if (just.length || (R.extras || []).length) h += '<div class="money" style="border-color:rgba(217,119,6,.45)"><h3 class="warn">📝 Anomalies justifiées</h3>' + just.map(function (x) { return '<div class="r"><span>' + esc(x.name) + '<br><small class="mute">' + esc(x.justif.reason) + (x.justif.text ? ' — ' + esc(x.justif.text) : '') + '</small></span><b class="warn">' + fq(x.got) + ' / ' + fq(x.bought) + '</b></div>'; }).join('') + (R.extras || []).map(function (x) { return '<div class="r"><span>Hors bon — ' + esc(x.name) + '<br><small class="mute">' + esc(x.justif.reason) + '</small></span><b class="warn">× ' + x.n + '</b></div>'; }).join('') + '</div>';
        if ((R.priceChanges || []).length) h += '<div class="money"><h3>🏷️ Prix de vente mis à jour</h3>' + R.priceChanges.map(function (x) { return '<div class="r"><span>' + esc(x.name) + '</span><b>' + eur(x.old) + ' → ' + eur(x.nw) + '</b></div>'; }).join('') + '</div>';
        h += '<div class="money"><h3>📋 Détail</h3>' + (R.received || []).map(function (x) { var st = x.got === x.bought ? 'ok' : 'warn'; return '<div class="r"><span>' + esc(x.name) + '<br><small class="mute">commandé ' + fq(x.qty) + ' · acheté ' + fq(x.bought) + '</small></span><b class="' + st + '">' + fq(x.got) + '</b></div>'; }).join('') + '</div>';
        $('app').innerHTML = h;
        $('foot-in').innerHTML = '<button class="big b-ghost" id="b-list">← Bons</button><button class="big b-pri" id="b-print">🖨️ Imprimer</button>';
        $('b-list').onclick = renderList; $('b-print').onclick = function () { printReport(b); };
        window.scrollTo(0, 0);
    }
    function printReport(b) {
        var R = b.result || {}, P = b.purchase || {}, w = window.open('', '_blank'); if (!w) { toast('Autorisez les fenêtres pop-up'); return; }

        w.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Intégration ' + esc(b.numero) + '</title><style>body{font-family:Arial,sans-serif;color:#0f172a;padding:24px;font-size:12px}h1{font-size:19px;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#1e1b4b;color:#fff;text-align:left;padding:7px}td{padding:6px 7px;border-bottom:1px solid #e5e7eb}.r{text-align:right}.box{border:1px solid #ddd;border-radius:8px;padding:8px 10px;margin-top:10px}</style></head><body>' +
            '<h1>Bon de commande ' + esc(b.numero) + ' — intégration</h1><div>Commandé le ' + fdate(b.date) + ' · acheté le ' + fdate(P.validatedAt, true) + (P.fournisseur ? ' chez ' + esc(P.fournisseur) : '') + ' · intégré le ' + fdate(R.validatedAt, true) + ' par ' + esc(R.by || '—') + '</div>' +

            '<table><thead><tr><th>Article</th><th>Code-barres</th><th class="r">Commandé</th><th class="r">Acheté</th><th class="r">Reçu</th><th class="r">Prix vente</th><th>Contrôle</th></tr></thead><tbody>' +

    /* ── QR du bon ── */
    function showQR(b, title, sub) {

        sheet('<h2>' + (title || '▦ ' + esc(b.numero)) + '</h2><div class="sub">' + (sub || 'Scannez ce QR code avec l’appli Réception d’un autre téléphone ou à l’emplacement d’intégration de COVO Pro : le bon y est récupéré avec ses achats, sans attendre Google Drive.') + '</div>' +
            qrSlides(txt, 280) + '<div style="text-align:center;font-family:monospace;font-weight:800;margin:-6px 0 12px">' + esc(b.numero) + '</div>' +

        $('q-x').onclick = function () { clearInterval(CAROUSEL); closeSheet(); if (title) renderList(); };
    }

    /* ── Utilitaires d'affichage ── */
    function ring(pct, bad) { var C = 2 * Math.PI * 32; return '<div class="sum"><div class="ring"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="32" fill="none" stroke="var(--card2)" stroke-width="9"/><circle cx="39" cy="39" r="32" fill="none" stroke="' + (bad ? 'var(--bad)' : 'var(--ok)') + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg><b>' + Math.round(pct * 100) + '%</b></div>%RIGHT%</div>'; }
    function flash(kind, ic, t, sub) { var f = $('flash'); if (!f) return; f.className = 'flash on ' + kind; f.innerHTML = '<span class="ic">' + ic + '</span><div>' + esc(t) + '<small>' + esc(sub || '') + '</small></div>'; camMsg(ic + ' ' + t); }
    function hitLine() { if (LASTHIT == null) return; var el = document.querySelector('.ln[data-i="' + LASTHIT + '"]'); if (el) { el.classList.add('hit'); if (el.scrollIntoView && !CAM) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } LASTHIT = null; }
    function sheet(html) { $('sheet').innerHTML = html; $('modal').classList.add('on'); }
    function closeSheet() { var m = $('modal'); if (!m.classList.contains('on')) return; if (CAM && CAM.video && $('sheet').contains(CAM.video)) camStop(); m.classList.remove('on'); }
    $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeSheet(); });

    /* ── Délégation des clics ── */
    document.addEventListener('click', function (e) {
        var t = e.target, el, b;
        if ((el = t.closest('[data-cam="stop"]'))) { camStop(); return; }
        if ((el = t.closest('[data-cam="torch"]'))) { camTorch(); return; }
        if ((el = t.closest('[data-spot]'))) { openScanSheet(el.getAttribute('data-spot')); return; }
        if ((el = t.closest('[data-bon]'))) { openBon(el.getAttribute('data-bon')); return; }
        if ((el = t.closest('[data-tl]'))) { TABL = el.getAttribute('data-tl'); renderList(); return; }
        if ((el = t.closest('.chips [data-f]'))) { FLT = el.getAttribute('data-f'); if (VIEW === 'achat') renderAchat(); else renderInteg(); return; }
        /* achats */
        if ((el = t.closest('[data-pay]'))) { b = getBon(CUR); pur(b).payMode = el.getAttribute('data-pay'); putBon(b); renderAchat(); return; }
        if ((el = t.closest('[data-tick]'))) { b = getBon(CUR); var i = +el.getAttribute('data-tick'), x = pl(b, i); x.done = !x.done; if (x.done && (x.got == null || x.got === 0)) x.got = num(b.lines[i].qty); if (b.status === 'a_recevoir') b.status = 'en_achat'; putBon(b); LASTHIT = i; renderAchat(); return; }
        if ((el = t.closest('[data-anf]'))) { b = getBon(CUR); var i2 = +el.getAttribute('data-anf'), x2 = pl(b, i2); if (x2.done && num(x2.got) === 0) { x2.done = false; x2.got = null; } else { x2.done = true; x2.got = 0; } if (b.status === 'a_recevoir') b.status = 'en_achat'; putBon(b); LASTHIT = i2; renderAchat(); return; }
        if ((el = t.closest('[data-aqp]')) || (el = t.closest('[data-aqm]'))) { b = getBon(CUR); var i3 = +(el.getAttribute('data-aqp') || el.getAttribute('data-aqm')), x3 = pl(b, i3), cur = x3.got == null ? num(b.lines[i3].qty) : num(x3.got); x3.got = Math.max(0, cur + (el.hasAttribute('data-aqp') ? 1 : -1)); x3.done = true; if (b.status === 'a_recevoir') b.status = 'en_achat'; putBon(b); LASTHIT = i3; renderAchat(); return; }
        /* intégration */
        if ((el = t.closest('[data-p]')) || (el = t.closest('[data-m]'))) {
            b = getBon(CUR); if (!b) return; var k = +(el.getAttribute('data-p') || el.getAttribute('data-m')), plus = el.hasAttribute('data-p'), r = rec(b);
            if (!r.startedAt) r.startedAt = new Date().toISOString(); b.status = 'en_cours';
            r.counts[k] = Math.max(0, got(b, k) + (plus ? 1 : -1)); delete r.justif[k];
            if (plus) r.log.push({ t: Date.now(), bc: 'manuel', i: k, txt: b.lines[k].name + ' +1 (manuel) → ' + got(b, k) });
            putBon(b); LASTHIT = k; renderInteg(); return;
        }
        if ((el = t.closest('[data-jv]'))) {
            var key = el.getAttribute('data-jv'), sel = document.querySelector('[data-jr="' + key + '"]'), txt = document.querySelector('[data-jt="' + key + '"]');
            if (!sel || !sel.value) { toast('Choisissez le motif de l’anomalie'); if (sel) sel.focus(); beep('warn'); return; }
            b = getBon(CUR); var rr = rec(b), J1 = { reason: sel.value, text: (txt && txt.value || '').trim(), decision: 'valide', by: uname(), at: new Date().toISOString() };
            if (key[0] === 'l') { var li = +key.slice(1); J1.qty = got(b, li); rr.justif[li] = J1; LASTHIT = li; } else { var xe = rr.extras[+key.slice(1)]; if (xe) xe.justif = J1; }
            putBon(b); beep('done'); renderInteg(); toast('📝 Anomalie justifiée et validée'); return;
        }
        if ((el = t.closest('[data-jc]'))) { b = getBon(CUR); var lc = +el.getAttribute('data-jc').slice(1), rc = rec(b); rc.counts[lc] = bought(b, lc); delete rc.justif[lc]; rc.log.push({ t: Date.now(), bc: 'manuel', i: -2, txt: b.lines[lc].name + ' corrigé à ' + fq(rc.counts[lc]) }); putBon(b); LASTHIT = lc; renderInteg(); toast('↺ Quantité corrigée'); return; }
        if ((el = t.closest('[data-jzero]'))) { b = getBon(CUR); var lz = +el.getAttribute('data-jzero'), rz = rec(b); rz.counts[lz] = 0; if (!rz.startedAt) rz.startedAt = new Date().toISOString(); b.status = 'en_cours';
            sheet('<h2>Déclarer manquant</h2><div class="sub">' + esc(b.lines[lz].name) + ' : 0 reçu pour ' + fq(bought(b, lz), b.lines[lz].kg) + ' acheté(s).</div><div class="just" style="margin:0"><select id="z-r"><option value="">— Motif —</option>' + REASONS.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('') + '</select><input id="z-t" placeholder="Précision (facultatif)"></div><div style="height:10px"></div><button class="big b-ok" id="z-ok">✅ Justifier et valider</button><div style="height:8px"></div><button class="big b-ghost" id="z-x">Annuler</button>');
            $('z-x').onclick = closeSheet; $('z-ok').onclick = function () { if (!$('z-r').value) { toast('Choisissez le motif'); return; } var bb = getBon(CUR), rb = rec(bb); rb.counts[lz] = 0; rb.justif[lz] = { reason: $('z-r').value, text: $('z-t').value.trim(), decision: 'valide', qty: 0, by: uname(), at: new Date().toISOString() }; bb.status = 'en_cours'; putBon(bb); closeSheet(); LASTHIT = lz; renderInteg(); };
            return; }
        if ((el = t.closest('[data-jreopen]'))) { b = getBon(CUR); delete rec(b).justif[+el.getAttribute('data-jreopen')]; putBon(b); renderInteg(); return; }
        if ((el = t.closest('[data-xreopen]'))) { b = getBon(CUR); var xr = rec(b).extras[+el.getAttribute('data-xreopen')]; if (xr) xr.justif = null; putBon(b); renderInteg(); return; }
        if ((el = t.closest('[data-xm]'))) { b = getBon(CUR); var rx = rec(b), ix = +el.getAttribute('data-xm'); if (rx.extras[ix]) { rx.extras[ix].n--; rx.extras = rx.extras.filter(function (x) { return x.n > 0; }); } putBon(b); renderInteg(); return; }
        if ((el = t.closest('[data-um]'))) { b = getBon(CUR); var ru = rec(b), cu = el.getAttribute('data-um'); ru.unknown = ru.unknown.filter(function (x) { return x.bc !== cu; }); putBon(b); renderInteg(); return; }
    });
    document.addEventListener('change', function (e) {
        var t = e.target, b;
        if (t.hasAttribute && t.hasAttribute('data-aq')) { b = getBon(CUR); var i = +t.getAttribute('data-aq'), x = pl(b, i); x.got = Math.max(0, num(t.value)); x.done = true; if (b.status === 'a_recevoir') b.status = 'en_achat'; putBon(b); LASTHIT = i; renderAchat(); return; }
        if (t.hasAttribute && t.hasAttribute('data-ap')) { b = getBon(CUR); var i2 = +t.getAttribute('data-ap'), x2 = pl(b, i2); x2.price = t.value.trim() === '' ? null : r2(t.value); if (b.status === 'a_recevoir') b.status = 'en_achat'; putBon(b); renderAchat(); return; }
        if (t.hasAttribute && t.hasAttribute('data-kg')) { b = getBon(CUR); var k = +t.getAttribute('data-kg'), r = rec(b); r.counts[k] = Math.max(0, num(t.value)); delete r.justif[k]; b.status = 'en_cours'; if (!r.startedAt) r.startedAt = new Date().toISOString(); putBon(b); LASTHIT = k; renderInteg(); return; }
    });
    window.addEventListener('storage', function (e) { if (e.key === KB && !CAM && !document.activeElement.matches('input,select')) { if (VIEW === 'list') renderList(); else if (VIEW === 'achat') renderAchat(); else if (VIEW === 'integ') renderInteg(); } });
    document.addEventListener('visibilitychange', function () { if (document.hidden) camStop(); });
    window.addEventListener('pagehide', camStop);

    /* ── Thème, accès, PWA ── */
    function theme() { var d = localStorage.getItem('covo_dark_mode'); var dark = d === 'true' || d === '1' || (d == null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); document.body.classList.toggle('dark', !!dark); document.documentElement.classList.toggle('dark', !!dark); }
    function pwa() {
        if (EMBED) return;
        try {
            var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
            var icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#3730a3"/><text x="256" y="330" font-size="260" text-anchor="middle">📦</text></svg>');
            var m = { name: 'Réception Pro — COVO', short_name: 'Réception', start_url: base, scope: base, display: 'standalone', background_color: '#1e1b4b', theme_color: '#1e1b4b', icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }] };
            var l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(l);
            var a = document.createElement('link'); a.rel = 'icon'; a.href = icon; document.head.appendChild(a);
        } catch (e) {}
    }
    function boot() {
        theme(); pwa(); if (EMBED) document.body.classList.add('embed');
        if (!user() && EMBED) {
            setHead('Réception des commandes', 'COVO Pro', '');
            $('app').innerHTML = '<div class="gate"><div class="ic">🔐</div><h2>Connexion nécessaire</h2><p style="color:var(--mute)">Connectez-vous d’abord à COVO Pro sur cet appareil : la Réception utilise le même compte et ses données.</p><a class="big b-pri" style="text-decoration:none;display:block" href="../app/">Ouvrir COVO Pro</a></div>';
            return;
        }
        if (!EMBED) window.addEventListener('hashchange', function () { if (linkPayload(location.hash)) openFromLink(location.hash, true); });
        if (linkPayload(location.hash)) { renderList(); openFromLink(location.hash, true); return; }
        var q = QS.get('bon'), mode = QS.get('scan'), rc = QS.get('rc');
        if (rc) { dispatchCode(rc); if (VIEW !== 'list') return; }
        if (q) { var b = q.indexOf(QRP) === 0 ? importBon(q) : bons().find(function (x) { return x.id === q || x.numero === q; }); if (b) { openBon(b.id); return; } toast('Bon « ' + q + ' » introuvable sur cet appareil', 3500); }
        if (mode === 'integrer' || mode === 'acheter') { TABL = mode; renderList(); openScanSheet(mode); return; }
        renderList();
    }
    window._recep = { link: openFromLink, code: dispatchCode, open: openBon, list: renderList, pack: function (id) { return packBon(getBon(id)); }, packRC: function (id) { return packRC(getBon(id)); }, parts: qrParts, importBon: importBon };
    boot();
})();
